

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Calendar</title>
  <link rel="shortcut icon" href="icons8-calendar-100.png" type="image/x-icon">
  <link rel="stylesheet" href="app.css">
</head>
<body>

<div class="container">

  <div class="clock-box">
    <h1 id="time">00:00:00</h1>
    <p id="fullDate">Wednesday, 10 June 2026</p>

    <div class="calendar">

      <div class="calendar-header">
        <button id="prev">&#10094;</button>

        <div class="month-year">
          <h2 id="month"></h2>
          <span id="year"></span>
        </div>

        <button id="next">&#10095;</button>
      </div>

      <div class="weekdays">
        <div>Sun</div>
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>
      </div>

      <div class="days" id="days"></div>

    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
